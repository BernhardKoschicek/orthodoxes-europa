[project]
name = "orthodoxes-europa"
version = "0.1.0"
description = "Orthodoxes Europa web application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.0",
    "gunicorn>=23.0.0",
    "jinja2>=3.1.0",
    "pillow>=11.0.0",
    "redis>=5.0.0",
    "werkzeug>=3.1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pylint>=3.3.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
