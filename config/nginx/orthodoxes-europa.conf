# Nginx Reverse Proxy Configuration for Orthodoxes Europa
# Debian packages required: nginx, certbot, python3-certbot-nginx
#
# Installation on host:
#   sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo cp config/nginx/orthodoxes-europa.conf /etc/nginx/sites-available/orthodoxes-europa.conf
#   sudo ln -sf /etc/nginx/sites-available/orthodoxes-europa.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d orthodoxes-europa.at -d www.orthodoxes-europa.at

upstream orthodoxes_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name orthodoxes-europa.at www.orthodoxes-europa.at;

    client_max_body_size 64M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Static Assets (CSS, JS, Fonts, UI Icons)
    location /static/ {
        alias /var/www/orthodoxes-europa/app/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri @proxy_to_app;
    }

    # Persistent Media (Images, PDFs, Videos, Thumbnails)
    location /media/ {
        alias /var/www/orthodoxes-europa/storage/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        # If thumbnail does not exist on disk, fallback to Flask to generate on-demand
        try_files $uri @proxy_to_app;
    }

    # Application Proxy
    location / {
        try_files $uri @proxy_to_app;
    }

    location @proxy_to_app {
        proxy_pass http://orthodoxes_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
